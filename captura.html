<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Jugador</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #8B90A0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            width: 450px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            font-family: monospace;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 25px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="number"], input[type="file"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        fieldset {
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            margin-top: 15px;
            padding: 10px 15px;
        }
        legend {
            font-weight: bold;
            padding: 0 5px;
        }
        .checkbox-group, .radio-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit { background-color: #007bff; }
        .btn-reset { background-color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h2>Formulario de Jugador</h2>
    
    <form action="index.php" method="POST" enctype="multipart/form-data">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="alias">Alias:</label>
        <input type="text" id="alias" name="alias" required>

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" required min="1">

        <fieldset>
            <legend>Armas a elegir (puedes elegir varias):</legend>
            <div class="checkbox-group">
                <label><input type="checkbox" name="armas[]" value="Maza"> Maza</label>
                <label><input type="checkbox" name="armas[]" value="Antorcha"> Antorcha</label>
                <label><input type="checkbox" name="armas[]" value="Martillo"> Martillo</label>
                <label><input type="checkbox" name="armas[]" value="Látigo"> Látigo</label>
            </div>
        </fieldset>

        <fieldset>
            <legend>¿Practica artes mágicas?</legend>
            <div class="radio-group">
                <label><input type="radio" name="magia" value="Sí" required> Sí</label>
                <label><input type="radio" name="magia" value="No"> No</label>
            </div>
        </fieldset>

        <label for="imagen">Subir imagen:</label>
        <input type="file" id="imagen" name="imagen">

        <div class="buttons">
            <button type="submit" class="btn-submit">Enviar</button>
            <button type="reset" class="btn-reset">Borrar</button>
        </div>
    </form>
</div>

</body>
</html>
